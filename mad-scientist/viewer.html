<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine Viewer · Mad Scientist</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #12161c; color: #dfe6ee; font: 14px/1.4 system-ui, sans-serif; display: flex; height: 100vh; }
  aside { width: 260px; overflow: auto; border-right: 1px solid #263040; padding: 12px; box-sizing: border-box; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8aa0b8; margin: 14px 0 6px; }
  button { display: block; width: 100%; text-align: left; background: none; color: inherit; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { background: #1d2633; }
  button.on { background: #2b3a50; color: #fff; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { background: #5a5a6e; border-radius: 8px; max-width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<aside id="list"></aside>
<main>
  <canvas id="c" width="650" height="650"></canvas>
  <div class="row">
    <label>Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label><input id="mixToggle" type="checkbox" checked> Cross-fade</label>
    <span id="info"></span>
  </div>
</main>
<script type="module">
import { Renderer } from './js/gl.js';
import { Skeleton, AnimationState, drawSkeleton, loadSkeletonData } from './js/spine.js';
import { loadImage, SKELETONS } from './js/assets.js';

const canvas = document.getElementById('c');
const renderer = new Renderer(canvas);
const params = new URLSearchParams(location.search);
const cache = new Map();
let current = null;

async function open(key, animName, time) {
  if (!cache.has(key)) cache.set(key, await loadSkeletonData(renderer, SKELETONS[key], loadImage));
  const data = cache.get(key);
  const skeleton = new Skeleton(data);
  const state = new AnimationState(data);
  const anims = Object.keys(data.animations);
  const anim = animName && data.animations[animName] ? animName : anims[0];
  state.set(0, anim, { loop: true });
  current = { key, data, skeleton, state, anim };
  if (time !== undefined) {
    // Static frame render used for automated comparison with the PNG exports.
    state.update(time);
    pose();
    window.__frameReady = true;
  }
  renderList();
}

function pose() {
  const { skeleton, state, data } = current;
  skeleton.setToSetupPose();
  state.apply(skeleton);
  skeleton.updateWorldTransform();
  const sk = data.json.skeleton;
  renderer.begin(650, 650, [0.353, 0.353, 0.431]);
  // Map Spine space onto the 650x650 export frame.
  drawSkeleton(renderer, skeleton, -sk.x, sk.y + sk.height, 1, 1);
  renderer.end();
}

function renderList() {
  const el = document.getElementById('list');
  el.innerHTML = '';
  for (const key of Object.keys(SKELETONS)) {
    const b = document.createElement('button');
    b.textContent = key;
    b.className = current && current.key === key ? 'on' : '';
    b.onclick = () => open(key);
    el.append(b);
    if (current && current.key === key) {
      const h = document.createElement('h2');
      h.textContent = 'Animations';
      el.append(h);
      for (const a of Object.keys(current.data.animations)) {
        const ab = document.createElement('button');
        ab.textContent = '▸ ' + a + ' (' + current.data.animations[a].duration.toFixed(2) + 's)';
        ab.className = current.anim === a ? 'on' : '';
        ab.onclick = () => {
          current.anim = a;
          current.state.set(0, a, { loop: true, mix: document.getElementById('mixToggle').checked ? 0.2 : 0 });
          renderList();
        };
        el.append(ab);
      }
      const h2 = document.createElement('h2');
      h2.textContent = 'Skeletons';
      el.append(h2);
    }
  }
}

const t = params.get('t');
await open(params.get('skel') || 'Gun01', params.get('anim') || undefined, t !== null ? +t : undefined);

if (t === null) {
  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    current.state.update(dt * +document.getElementById('speed').value);
    pose();
    document.getElementById('info').textContent = `${current.key} · ${current.anim} · ${renderer.drawCalls} draw call(s)`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
} else {
  window.__snapshot = () => { pose(); return canvas.toDataURL('image/png'); };
}
</script>
</body>
</html>
